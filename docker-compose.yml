  # ---------------------------------------------------------------------------------
  # RabbitMQ
  # ---------------------------------------------------------------------------------

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:4-management-alpine
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: test
      RABBITMQ_DEFAULT_PASS: test
    volumes:
      - rabbitmq:/var/lib/rabbitmq

  # ---------------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------------

  redis:
    container_name: redis
    image: redis:latest
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis:/data

  # ---------------------------------------------------------------------------------
