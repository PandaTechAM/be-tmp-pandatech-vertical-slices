  # ---------------------------------------------------------------------------------
  # Postgres
  # ---------------------------------------------------------------------------------

  postgres_db:
    container_name: postgres
    image: postgres:latest
    restart: always
    environment:
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=test
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      
